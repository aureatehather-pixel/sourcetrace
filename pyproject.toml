[project]
name = "personal-intelligence-engine"
version = "0.1.0"
description = "Evidence-first knowledge store: durable ingestion with provenance, verbatim-checked extraction, conservative entity resolution and reviewable cross-evidence relations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "anthropic>=1.0",
    # Direct because `deepseek_provider` posts with it. It already arrives
    # under `anthropic` 1.x, but depending on a transitive is depending on
    # someone else's choice not to change.
    "httpx2>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
# The whole point of the CLI: one short word, then a verb.
pie = "intelligence_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_engine"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evaluation", "demo"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async correctness
    "S",                # bandit-ish security
    "T20",              # no print
]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]          # asserts are the point
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations", "evaluation", "demo"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a real PostgreSQL instance (Docker/Testcontainers)",
]
filterwarnings = ["error::DeprecationWarning:intelligence_engine.*"]
